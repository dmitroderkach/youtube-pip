name: Manual E2E

on:
  workflow_dispatch:
    inputs:
      force_report:
        description: 'On-call: investigate and send the Telegram report even if everything passed'
        type: boolean
        default: false
      probe_flags:
        description: 'On-call: comma-separated flags to probe (chromium e2e set with the flag flipped) even if not new'
        type: string
        default: ''
  # Daily run: EventBridge Scheduler dispatches this workflow at 18:00 Warsaw time (terraform/oncall_schedule.tf).
  # Not GitHub's `schedule`: it started runs hours late and stopped after 60 days without repository activity.

jobs:
  e2e:
    runs-on: [self-hosted, fargate]

    steps:
      - name: Runner capacity
        # Set by the dispatcher Lambda (terraform/lambda/worker.py): warn when Spot was unavailable and the job runs
        # on on-demand Fargate (~3x the Spot price), so the fallback never goes unnoticed.
        run: |
          echo "Runner capacity: ${RUNNER_CAPACITY:-unknown}"
          if [ "${RUNNER_CAPACITY:-}" = "FARGATE" ]; then
            echo "::warning title=On-demand runner::Fargate Spot was unavailable; this job runs on on-demand Fargate (8 vCPU / 16 GB, ~3x the Spot price)."
          fi

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Cache npm
        id: cache-npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Build userscript
        run: npm run build

      - name: Run full e2e tests (manual)
        id: e2e
        env:
          SKIP_AUTH_E2E_ON_CI: 'false'
          # JSON report and full output for the on-call job
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-results/results.json
          # Flags served to failed attempts and passing retries, for the flag culprit check (docs/ONCALL.md)
          E2E_PAGE_FLAGS_DIR: e2e-results/page-flags
        run: |
          set -o pipefail
          mkdir -p e2e-results
          npx playwright test --reporter=list,html,json 2>&1 | tee e2e-results/e2e-output.log

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always() && steps.e2e.outcome != 'skipped'
        with:
          name: playwright-report-manual-e2e
          path: playwright-report/
          retention-days: 7

      - name: Upload e2e results (on-call)
        uses: actions/upload-artifact@v7
        if: always() && steps.e2e.outcome != 'skipped'
        with:
          name: e2e-results
          path: e2e-results/
          retention-days: 7

  # Flags (docs/ONCALL.md): scan the experiment flags in YouTube's code and on a served page; for each new relevant
  # flag run the `chromium` e2e set once with the flag in the opposite state; for failed / flaky tests find the flag
  # that breaks them (flag culprit). On the CI runner (8 vCPU, test session); without new flags and failures it is
  # only the scan (no npm ci, no browser).
  flags:
    needs: e2e
    if: always()
    runs-on: [self-hosted, fargate]
    timeout-minutes: 50

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Restore flags already reported
        uses: actions/cache/restore@v5
        with:
          path: oncall/seen-flags.json
          key: oncall-seen-flags-${{ github.run_id }}
          restore-keys: oncall-seen-flags-

      - name: Scan experiment flags (code + served)
        run: node scripts/oncall/scan-flags.mjs oncall/flags oncall/seen-flags.json

      - name: Check for new flags
        id: new
        env:
          PROBE_FLAGS: ${{ inputs.probe_flags }}
        run: |
          node -e '
            const f = JSON.parse(require("fs").readFileSync("oncall/flags/flags.json", "utf8"));
            const requested = (process.env.PROBE_FLAGS || "").split(",").filter((x) => x.trim()).length;
            const n = f.newCodeFlags.length + f.newFlags.length + requested;
            console.log(`${n} flags to probe (${requested} requested)`);
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `count=${n}\n`);
          '

      - name: Download e2e results
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: e2e-results
          path: oncall/e2e

      - name: Check for failed tests to blame on flags
        id: failures
        run: |
          node --input-type=module -e '
            import { existsSync, readdirSync, appendFileSync } from "node:fs";
            import { summarizePlaywrightReport } from "./scripts/oncall/lib/playwright-results.mjs";
            const r = summarizePlaywrightReport("oncall/e2e/results.json");
            const records = existsSync("oncall/e2e/page-flags") ? readdirSync("oncall/e2e/page-flags").length : 0;
            const n = records ? r.failed.length + r.flaky.length : 0;
            console.log(`${r.failed.length} failed, ${r.flaky.length} flaky, ${records} page flag records`);
            appendFileSync(process.env.GITHUB_OUTPUT, `count=${n}\n`);
          '

      - name: Cache npm
        if: steps.new.outputs.count != '0' || steps.failures.outputs.count != '0'
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        if: steps.new.outputs.count != '0' || steps.failures.outputs.count != '0'
        run: npm ci

      - name: Build userscript
        if: steps.new.outputs.count != '0' || steps.failures.outputs.count != '0'
        run: npm run build

      - name: Probe new flags
        if: steps.new.outputs.count != '0'
        # A broken probe must not look like broken flag reading; the on-call reports missing probe results
        continue-on-error: true
        env:
          SKIP_AUTH_E2E_ON_CI: 'false'
          PROBE_FLAGS: ${{ inputs.probe_flags }}
        run: node scripts/oncall/probe-flags.mjs oncall/flags/flags.json oncall/probe

      - name: Find flag culprits
        if: steps.failures.outputs.count != '0'
        # Like the probe: a broken check must not look like broken flag reading
        continue-on-error: true
        env:
          SKIP_AUTH_E2E_ON_CI: 'false'
        run: node scripts/oncall/confirm-flag-culprit.mjs oncall/e2e/results.json oncall/e2e/page-flags oncall/culprits

      - name: Upload flags
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flags
          path: |
            oncall/flags/
            oncall/seen-flags.json
            oncall/probe/summary.json
            oncall/culprits/summary.json
          if-no-files-found: ignore
          retention-days: 7

  # On-call (docs/ONCALL.md): after every run, summarize the results, let Claude investigate regressions / new flags
  # and send the finding to Telegram. Runs on the `oncall` runner (Telegram / Claude secrets from AWS Secrets
  # Manager), which the dispatcher only starts for scheduled / manual runs of main.
  oncall:
    needs: [e2e, flags]
    if: always()
    runs-on: [self-hosted, fargate, oncall]
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Download e2e results
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: e2e-results
          path: oncall/e2e

      - name: Download Playwright report
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: playwright-report-manual-e2e
          path: oncall/e2e/playwright-report

      - name: Download flags and probes
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: flags
          path: oncall

      - name: Summarize results
        run: node scripts/oncall/summarize-results.mjs oncall/e2e/results.json oncall/results-summary.json

      - name: Decide
        id: decide
        env:
          FORCE_REPORT: ${{ inputs.force_report || false }}
          FLAGS_OUTCOME: ${{ needs.flags.result }}
        run: |
          node -e '
            const fs = require("fs");
            const r = JSON.parse(fs.readFileSync("oncall/results-summary.json", "utf8"));
            const f = fs.existsSync("oncall/flags/flags.json") ? JSON.parse(fs.readFileSync("oncall/flags/flags.json", "utf8")) : null;
            const reasons = [];
            if (!r.found) reasons.push("немає результатів e2e");
            if (r.failed.length) reasons.push(`${r.failed.length} впали`);
            if (r.flaky.length) reasons.push(`${r.flaky.length} флейкі`);
            if (process.env.FLAGS_OUTCOME !== "success") reasons.push("читання прапорців зламалось");
            if (f && f.newCodeFlags.length) reasons.push(`${f.newCodeFlags.length} нових прапорців у коді`);
            if (f && f.newFlags.length) reasons.push(`${f.newFlags.length} нових розкочених прапорців`);
            if (process.env.FORCE_REPORT === "true") reasons.push("запуск вручну з force_report");
            console.log(reasons.length ? `report: ${reasons.join(", ")}` : "all good, no report");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `report=${reasons.length ? "true" : "false"}\n`);
            fs.writeFileSync("oncall/reasons.txt", reasons.join(", "));
          '

      - name: Investigate (Claude Code, read-only)
        if: steps.decide.outputs.report == 'true'
        continue-on-error: true
        run: |
          # Read-only tools, no network / shell: it reads data downloaded from YouTube. Telegram secrets removed.
          env -u TELEGRAM_BOT_TOKEN -u TELEGRAM_CHAT_ID \
            npx -y @anthropic-ai/claude-code@2.1.319 -p "$(cat scripts/oncall/investigate-prompt.md)" \
              --allowedTools "Read,Grep,Glob" \
              --disallowedTools "Bash,Edit,Write,NotebookEdit,WebFetch,WebSearch,Task" \
              --model sonnet --max-turns 40 \
              --output-format stream-json --verbose > oncall/claude-transcript.jsonl
          # The final message is the report; the transcript stays in the artifact for follow-up sessions
          node -e '
            const fs = require("fs");
            const lines = fs.readFileSync("oncall/claude-transcript.jsonl", "utf8").split("\n").filter(Boolean);
            const result = lines.map((l) => { try { return JSON.parse(l); } catch { return null; } })
              .filter((e) => e && e.type === "result").pop();
            if (result && typeof result.result === "string") fs.writeFileSync("oncall/report.txt", result.result);
          '

      - name: Compose message
        if: steps.decide.outputs.report == 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          node -e '
            const fs = require("fs");
            const r = JSON.parse(fs.readFileSync("oncall/results-summary.json", "utf8"));
            const result = { success: "успіх", failure: "провал", cancelled: "скасовано", skipped: "пропущено" }[process.env.E2E_RESULT] || process.env.E2E_RESULT;
            const header = `YouTube PiP — щоденні e2e (${result})\n` +
              (r.found ? `${r.total} тестів: ${r.passed} пройшли, ${r.failed.length} впали, ${r.flaky.length} флейкі\n` : "результатів e2e немає\n") +
              `Причина: ${fs.existsSync("oncall/reasons.txt") ? fs.readFileSync("oncall/reasons.txt", "utf8") : "?"}\n` +
              `${process.env.RUN_URL}\n\n`;
            const report = fs.existsSync("oncall/report.txt") && fs.readFileSync("oncall/report.txt", "utf8").trim();
            const fallback = "Розслідування Claude не вдалося; сирі дані:\n" +
              [...r.failed, ...r.flaky].map((t) => `${t.status} [${t.project}] ${t.title}: ${t.error.split("\n")[0]}`).join("\n");
            // Flags not probed: always stated, independent of the investigation text
            const probe = fs.existsSync("oncall/probe/summary.json") ? JSON.parse(fs.readFileSync("oncall/probe/summary.json", "utf8")) : null;
            const overLimit = (probe?.skipped ?? []).filter((x) => x.kind === "limit").map((x) => x.flag);
            const nonBoolean = (probe?.skipped ?? []).filter((x) => x.kind === "non_boolean").map((x) => x.flag);
            const probeNote =
              (overLimit.length ? `\n\n⏳ Не прогнано тестами (ліміт ${probe.probed.length} за прогін, будуть у наступних): ${overLimit.join(", ")}` : "") +
              (nonBoolean.length ? `\n\nℹ️ Не прогнано (не булеві значення): ${nonBoolean.join(", ")}` : "");
            // Flag culprits (scripts/oncall/confirm-flag-culprit.mjs): deterministic, independent of the investigation
            const culprits = fs.existsSync("oncall/culprits/summary.json") ? JSON.parse(fs.readFileSync("oncall/culprits/summary.json", "utf8")) : [];
            const testName = (c) => `[${c.project}] ${c.title}${c.status === "flaky" ? " (флейк)" : ""}`;
            const culpritLines = culprits.filter((c) => c.result !== "skipped_limit").map((c) => ({
              culprit: `🎯 Прапорець-винуватець: ${c.culprit} — ${testName(c)}: з ним падає, без нього проходить (${c.runs} перезапусків)`,
              interaction: `🎯 Падає лише з комбінацією прапорців ${(c.set || []).join(", ")} — ${testName(c)}`,
              not_reproduced: `🔎 ${testName(c)}: з прапорцями спроби, що впала (${c.suspects}), тест проходить — не прапорець`,
              not_flags: `🔎 ${testName(c)}: падає і з вимкненими прапорцями (${c.suspects}) — не прапорець`,
              no_suspects: `🔎 ${testName(c)}: ` + (c.status === "flaky" ? "спроба, що пройшла, мала ті самі прапорці — не прапорець" : "релевантних прапорців на сторінці не було"),
            })[c.result] || `🔎 ${testName(c)}: ${c.result}`);
            const culpritsSkipped = culprits.filter((c) => c.result === "skipped_limit").map(testName);
            const culpritNote = culpritLines.length || culpritsSkipped.length
              ? culpritLines.join("\n") + (culpritsSkipped.length ? `${culpritLines.length ? "\n" : ""}⏳ Не перевірено на прапорці (ліміт за прогін): ${culpritsSkipped.join("; ")}` : "") + "\n\n"
              : "";
            const followUp = `\n\nПродовжити в Claude Code (у репо youtube-pip): Розбери онкол-прогін ${process.env.RUN_URL}`;
            fs.writeFileSync("oncall/message.txt", header + culpritNote + (report || fallback) + probeNote + followUp);
          '

      - name: Send to Telegram
        id: send
        if: steps.decide.outputs.report == 'true'
        run: node scripts/oncall/telegram-send.mjs oncall/message.txt

      - name: Keep unprobed flags new
        # Flags over the probe limit are not marked as seen: they come back as new and are probed in the next run
        if: needs.flags.result == 'success'
        run: |
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("oncall/probe/summary.json") || !fs.existsSync("oncall/seen-flags.json")) process.exit(0);
            const later = new Set(JSON.parse(fs.readFileSync("oncall/probe/summary.json", "utf8")).skipped.filter((x) => x.kind === "limit").map((x) => x.flag));
            const seen = JSON.parse(fs.readFileSync("oncall/seen-flags.json", "utf8"));
            for (const key of ["served", "code"]) seen[key] = (seen[key] || []).filter((name) => !later.has(name));
            fs.writeFileSync("oncall/seen-flags.json", JSON.stringify(seen));
            console.log(`${later.size} flags left new for the next probe run`);
          '

      - name: Save flags already reported
        # Only after the report went out (or none was needed), so new flags are not lost when the on-call breaks
        if: needs.flags.result == 'success' && (steps.decide.outputs.report != 'true' || steps.send.outcome == 'success')
        uses: actions/cache/save@v5
        with:
          path: oncall/seen-flags.json
          key: oncall-seen-flags-${{ github.run_id }}

      - name: Report on-call failure
        # The on-call itself broke before a message went out (checkout, scripts, Claude, Telegram call): still tell
        # the owner, so a silent failure never looks like "all good".
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '🔴 Онкол зламався\nДжоба oncall впала до відправки звіту; результати e2e і прапорці не перевірені.\n%s\n\nПродовжити в Claude Code (у репо youtube-pip): Розбери онкол-прогін %s\n' "$RUN_URL" "$RUN_URL" > oncall-failure.txt
          node scripts/oncall/telegram-send.mjs oncall-failure.txt

      - name: Upload on-call output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oncall
          path: |
            oncall/results-summary.json
            oncall/flags/flags.json
            oncall/probe/summary.json
            oncall/culprits/summary.json
            oncall/report.txt
            oncall/message.txt
            oncall/claude-transcript.jsonl
          if-no-files-found: ignore
          retention-days: 14
