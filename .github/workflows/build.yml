name: Build Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run Prettier check
        run: npm run prettier

      - name: Type check
        run: npm run type-check

      - name: Run tests
        run: npm run test

      - name: Build userscript
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Cache e2e auth state
        id: cache-e2e-auth
        uses: actions/cache@v4
        with:
          path: e2e/.auth
          key: ${{ runner.os }}-e2e-auth-v1
          restore-keys: |
            ${{ runner.os }}-e2e-auth-

      - name: Debug e2e auth cache
        run: |
          echo "=== Cache hit: ${{ steps.cache-e2e-auth.outputs.cache-hit }} ==="
          echo "=== Contents of e2e/.auth ==="
          ls -la e2e/.auth 2>/dev/null || echo "(folder missing or empty)"
          echo "=== storageState.json: size and first 600 chars (no cookies) ==="
          if [ -f e2e/.auth/storageState.json ]; then
            wc -c < e2e/.auth/storageState.json
            head -c 600 e2e/.auth/storageState.json
            echo ""
          else
            echo "(file missing)"
          fi

      - name: Run e2e tests
        id: e2e
        env:
          E2E_STORAGE_STATE_BASE64: ${{ secrets.E2E_STORAGE_STATE_BASE64 }}
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always() && (steps.e2e.outcome == 'success' || steps.e2e.outcome == 'failure')
        with:
          name: playwright-report.zip
          path: playwright-report/
          retention-days: 7

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: userscript
          path: dist/userscript.js
          retention-days: 7
