name: Build Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: [self-hosted, fargate]

    steps:
      - name: Runner capacity
        # Set by the dispatcher Lambda (terraform/lambda/worker.py): warn when Spot was unavailable and the job runs
        # on on-demand Fargate (~3x the Spot price), so the fallback never goes unnoticed.
        run: |
          echo "Runner capacity: ${RUNNER_CAPACITY:-unknown}"
          if [ "${RUNNER_CAPACITY:-}" = "FARGATE" ]; then
            echo "::warning title=On-demand runner::Fargate Spot was unavailable; this job runs on on-demand Fargate (8 vCPU / 16 GB, ~3x the Spot price)."
          fi

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Cache npm
        id: cache-npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run Prettier check
        run: npm run prettier

      - name: Type check
        run: npm run type-check

      - name: Run tests
        run: npm run test

      - name: Build userscript
        run: npm run build

      - name: Run e2e tests
        id: e2e
        # Only on pull requests: main requires the PR branch to be up to date and its `build` check green before the
        # squash merge (ruleset "Protect main branch", strict status checks), so the merge commit has exactly the
        # tree the PR's e2e already ran on. The daily Manual E2E covers main.
        if: github.event_name == 'pull_request'
        env:
          SKIP_AUTH_E2E_ON_CI: ${{ vars.SKIP_AUTH_E2E_ON_CI || 'false' }}
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        # Also on cancel: Playwright stops on SIGINT and still writes the report (traces of failures so far),
        # so a run can be cancelled as soon as a flake shows up
        if: always() && steps.e2e.outcome != 'skipped'
        with:
          name: playwright-report.zip
          path: playwright-report/
          retention-days: 7

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: userscript
          path: dist/userscript.js
          retention-days: 7
