name: Build and Release Userscript

on:
  push:
    tags:
      - 'v*.*.*'
      # Pre-release tags vX.Y.Z-rc.N (prerelease.yml) are not releases
      - '!v*-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Cache npm
        id: cache-npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Build userscript
        run: npm run build

      - name: Rename for Greasy Fork compatibility
        run: cp dist/userscript.js dist/youtube-pip.user.js

      - name: Get version from package.json
        id: package-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Extract changelog for version
        id: changelog
        run: |
          VERSION="${{ github.ref_name }}"
          # Remove 'v' prefix if present (v1.0.1 -> 1.0.1)
          VERSION_NUM="${VERSION#v}"

          # Extract changelog section for this version
          # Find section starting with ## [VERSION] and extract until next ## or link section
          CHANGELOG_SECTION=$(awk -v version="$VERSION_NUM" '
            /^## \[/ { 
              if ($0 ~ "^## \\[" version "\\]") { 
                found=1
                next
              } else if (found) { 
                exit
              }
            }
            /^\[/ && found { exit }
            found { print }
          ' CHANGELOG.md)

          # Set as multiline output
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG_SECTION" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          files: |
            dist/userscript.js
            dist/youtube-pip.user.js
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## YouTube PiP ${{ steps.package-version.outputs.version }}

            ### Installation

            **Option 1: Direct install (recommended)**
            Click here to install: [youtube-pip.user.js](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/youtube-pip.user.js)

            **Option 2: Greasy Fork**
            Install from [Greasy Fork](https://greasyfork.org/en/scripts/564173-youtube-pip)

            ### Changelog

            ${{ steps.changelog.outputs.content }}

            ### Full Changelog
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for all changes.
          # Created as a draft with the assets, published in the next step: Greasy Fork syncs on the release webhook
          # from releases/latest/download/youtube-pip.user.js, which must already be there when the release is published
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release (Greasy Fork sync)
        # Publishing fires the `release` webhook; Greasy Fork then updates the script (docs/GREASY_FORK.md)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false --latest

      - name: Delete pre-releases of this version
        # vX.Y.Z-rc.N pre-releases (prerelease.yml, docs/PRERELEASE.md) were test builds of this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh api "repos/$REPO/git/matching-refs/tags/$TAG-rc." --jq '.[].ref' | sed 's#^refs/tags/##' | while read -r RC; do
            echo "Deleting pre-release $RC"
            gh release delete "$RC" --repo "$REPO" --cleanup-tag --yes || gh api -X DELETE "repos/$REPO/git/refs/tags/$RC"
          done
